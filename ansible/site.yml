---
- name: Ubuntu 24.04 hardening baseline
  hosts: servers
  become: true
  vars:
    ssh_port: 22                  # must match the real SSH port (used for ufw + fail2ban)
    ssh_allow_users: ""           # e.g. "admin deploy"; empty = no restriction
    ufw_extra_tcp: [80, 443]      # extra allowed TCP ports (add 25, 465, 587, 993 for mail)
    fail2ban_enable_mail: false   # postfix + dovecot jails
    fail2ban_enable_web: false    # apache-auth jail

  tasks:
    - name: Install baseline packages
      ansible.builtin.apt:
        name: [unattended-upgrades, fail2ban, ufw, auditd, lynis]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Enable unattended upgrades
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";

    - name: SSH hardening drop-in (00- prefix = read first = wins)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-hardening.conf
        mode: "0644"
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          MaxAuthTries 3
          LoginGraceTime 30
          X11Forwarding no
          AllowAgentForwarding no
          ClientAliveInterval 300
          ClientAliveCountMax 2
          {% if ssh_allow_users | length > 0 %}
          AllowUsers {{ ssh_allow_users }}
          {% endif %}
      notify: Restart ssh

    - name: ufw - allow SSH
      community.general.ufw:
        rule: allow
        port: "{{ ssh_port }}"
        proto: tcp

    - name: ufw - allow extra TCP ports
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop: "{{ ufw_extra_tcp }}"

    - name: ufw - default deny incoming, enable
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: fail2ban configuration
      ansible.builtin.copy:
        dest: /etc/fail2ban/jail.local
        mode: "0644"
        content: |
          [DEFAULT]
          bantime  = 1h
          findtime = 10m
          maxretry = 5

          [sshd]
          enabled = true
          port    = {{ ssh_port }}
          backend = systemd
          {% if fail2ban_enable_mail %}

          [postfix]
          enabled = true

          [dovecot]
          enabled = true
          {% endif %}
          {% if fail2ban_enable_web %}

          [apache-auth]
          enabled = true
          {% endif %}
      notify: Restart fail2ban

    - name: Conservative sysctl hardening
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-hardening.conf
        mode: "0644"
        content: |
          net.ipv4.conf.all.rp_filter = 1
          net.ipv4.conf.default.rp_filter = 1
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv6.conf.all.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.tcp_syncookies = 1
          net.ipv4.conf.all.log_martians = 1
          kernel.kptr_restrict = 2
      notify: Reload sysctl

    - name: Enable and start auditd
      ansible.builtin.service:
        name: auditd
        enabled: true
        state: started

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

    - name: Restart fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: restarted

    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
